# Builds and tests through the Makefile, the same way as on a developer machine; a version tag publishes the image.
name: ci

on:
  push:
    branches: [master, devel]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for the version the Makefile reads with git describe
      - run: make ci
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: startsWith(github.ref, 'refs/tags/v')
        run: make push IMAGE=ghcr.io/${{ github.repository }}:${{ github.ref_name }}
